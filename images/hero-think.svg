<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041e36"/>
      <stop offset="40%" stop-color="#0a4a6e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="url(#sky1)"/>
  
  <!-- Atmospheric orbs -->
  <circle cx="180" cy="120" r="220" fill="#22d3ee" opacity="0.07"/>
  <circle cx="1250" cy="650" r="280" fill="#14b8a6" opacity="0.1"/>
  <circle cx="1100" cy="100" r="140" fill="#67e8f9" opacity="0.08"/>
  <circle cx="300" cy="700" r="100" fill="#fff" opacity="0.04"/>

  <!-- Floating particles -->
  <g fill="#a5f3fc" opacity="0.4">
    <circle cx="120" cy="300" r="3"/>
    <circle cx="250" cy="180" r="2"/>
    <circle cx="90" cy="450" r="2.5"/>
    <circle cx="400" cy="90" r="2"/>
    <circle cx="1300" cy="280" r="3"/>
    <circle cx="1180" cy="480" r="2"/>
    <circle cx="1050" cy="200" r="2.5"/>
  </g>

  <!-- Large thought cloud group -->
  <g filter="url(#softShadow)" opacity="0.95">
    <ellipse cx="380" cy="320" rx="210" ry="120" fill="#e0f2fe" opacity="0.15"/>
    <ellipse cx="380" cy="320" rx="180" ry="95" fill="#bae6fd" opacity="0.12"/>
    <!-- Thought bubbles trail -->
    <circle cx="520" cy="420" r="28" fill="#e0f2fe" opacity="0.18"/>
    <circle cx="570" cy="460" r="16" fill="#e0f2fe" opacity="0.15"/>
    <circle cx="600" cy="490" r="9" fill="#e0f2fe" opacity="0.12"/>
  </g>

  <!-- Brain / mind icon inside thought -->
  <g transform="translate(300,250)" opacity="0.9">
    <path d="M40 50 C20 30 20 10 45 5 C60 0 80 10 85 30 C100 15 125 20 130 45 C145 40 160 55 155 75 C165 90 155 110 135 115 C140 130 120 145 95 140 C80 155 55 150 45 130 C25 140 10 120 15 100 C0 90 5 65 25 60 Z" 
          fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.8"/>
    <circle cx="70" cy="70" r="8" fill="#22d3ee" opacity="0.6"/>
    <circle cx="100" cy="65" r="6" fill="#22d3ee" opacity="0.5"/>
  </g>

  <!-- Text in thought -->
  <text x="380" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#e0f2fe" letter-spacing="-0.5">Mag-isip</text>
  <text x="380" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#7dd3fc">Bago Mag-Post</text>

  <!-- Smartphone -->
  <g filter="url(#softShadow)">
    <rect x="820" y="130" width="320" height="560" rx="42" fill="url(#phoneBody)" stroke="#64748b" stroke-width="5"/>
    <!-- Screen -->
    <rect x="840" y="170" width="280" height="480" rx="12" fill="#020617"/>
    <!-- Notch -->
    <rect x="930" y="145" width="100" height="18" rx="9" fill="#0f172a"/>
    
    <!-- Status bar -->
    <rect x="840" y="170" width="280" height="32" fill="#0f172a"/>
    <circle cx="860" cy="186" r="5" fill="#22d3ee"/>
    <circle cx="878" cy="186" r="5" fill="#64748b"/>
    <circle cx="896" cy="186" r="5" fill="#64748b"/>
    
    <!-- Fake social post -->
    <rect x="860" y="220" width="240" height="160" rx="14" fill="#1e293b"/>
    <circle cx="890" cy="250" r="18" fill="#38bdf8"/>
    <rect x="920" y="240" width="110" height="10" rx="5" fill="#94a3b8"/>
    <rect x="920" y="258" width="70" height="7" rx="3" fill="#64748b"/>
    <rect x="870" y="285" width="220" height="80" rx="8" fill="#334155"/>
    
    <!-- Second post (blurred) -->
    <rect x="860" y="400" width="240" height="100" rx="12" fill="#1e293b" opacity="0.5"/>
    <rect x="870" y="420" width="160" height="8" rx="4" fill="#475569"/>
    <rect x="870" y="440" width="200" height="8" rx="4" fill="#334155"/>
  </g>

  <!-- Big pause button overlay -->
  <g filter="url(#softGlow)">
    <circle cx="980" cy="480" r="70" fill="#0ea5e9"/>
    <circle cx="980" cy="480" r="70" fill="url(#glowBlue)"/>
    <rect x="955" y="450" width="18" height="60" rx="5" fill="#fff"/>
    <rect x="987" y="450" width="18" height="60" rx="5" fill="#fff"/>
  </g>

  <!-- Decorative circuit / digital lines -->
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M50 600 Q200 550 350 620 T650 580"/>
    <path d="M100 650 Q300 700 500 640"/>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="780" width="1400" height="20" fill="#14b8a6" opacity="0.4"/>
</svg>
